<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complejo — Cancha Libre</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { background: #f4f6fb; }

    /* Hero */
    .venue-hero { position:relative; height:280px; overflow:hidden; background:#1a3f62; }
    .venue-hero img { width:100%; height:100%; object-fit:cover; }
    .venue-hero .overlay { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.65) 100%); }
    .venue-hero .hero-content { position:absolute; bottom:0; left:0; right:0; padding:28px 24px; color:white; }
    .venue-hero h1 { font-size:1.8rem; font-weight:900; margin-bottom:6px; text-shadow:0 2px 8px rgba(0,0,0,0.4); }
    .venue-hero .address { font-size:0.88rem; opacity:0.85; display:flex; align-items:center; gap:6px; }

    /* WhatsApp bar */
    .wa-bar {
      background: #25D366; padding:14px 24px;
      display:flex; align-items:center; justify-content:center; gap:12px;
    }
    .wa-bar a {
      color:white; font-weight:800; font-size:1rem;
      display:flex; align-items:center; gap:8px;
      text-decoration:none;
    }
    .wa-bar svg { width:22px; height:22px; fill:white; }

    /* Contenido */
    .venue-body { max-width:900px; margin:0 auto; padding:28px 20px 60px; }

    /* Sección deporte */
    .sport-section { margin-bottom:36px; }
    .sport-section-header {
      display:flex; align-items:center; gap:12px;
      margin-bottom:16px; padding-bottom:12px;
      border-bottom:2px solid var(--border);
    }
    .sport-section-header .sport-icon { font-size:1.6rem; }
    .sport-section-header h3 { font-size:1.1rem; font-weight:900; flex:1; }
    .sport-section-header .count { font-size:0.8rem; color:var(--text-muted); background:var(--bg); padding:3px 10px; border-radius:20px; font-weight:700; }

    /* Cards de canchas */
    .courts-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
    .court-card { background:white; border-radius:16px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.08); transition:transform 0.2s,box-shadow 0.2s; }
    .court-card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.13); }
    .court-img { width:100%; height:170px; object-fit:cover; display:block; }
    .court-default { width:100%; height:170px; display:block; }
    .court-body { padding:16px; }
    .court-body h3 { font-size:1rem; font-weight:900; margin-bottom:10px; }
    .court-tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
    .court-tag { font-size:0.75rem; font-weight:700; padding:3px 10px; border-radius:20px; background:var(--bg); color:var(--text); }
    .court-tag.highlight { background:#e8f5e9; color:#2e7d32; }
    .court-price { font-size:1.1rem; font-weight:900; color:var(--primary-dark); }
    .court-price span { font-size:0.78rem; font-weight:500; color:var(--text-muted); }
    .court-desc { font-size:0.82rem; color:var(--text-muted); margin-bottom:10px; line-height:1.5; }

    /* Galería extra -->
    .gallery { display:flex; gap:6px; overflow-x:auto; padding:0 16px 12px; scrollbar-width:thin; }
    .gallery img { height:80px; width:110px; object-fit:cover; border-radius:8px; flex-shrink:0; }

    /* Amenidades */
    .section-title { font-size:1.1rem; font-weight:900; margin:36px 0 16px; }
    .amenities-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
    .amenity-chip { background:white; border-radius:12px; padding:16px 14px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.07); }
    .amenity-chip .icon { font-size:1.6rem; margin-bottom:6px; }
    .amenity-chip .name { font-size:0.82rem; font-weight:700; }
    .amenity-chip .desc { font-size:0.72rem; color:var(--text-muted); margin-top:3px; }
    .amenity-chip .price-tag { display:inline-block; margin-top:6px; font-size:0.72rem; font-weight:800; color:var(--primary); background:#eef2ff; padding:2px 8px; border-radius:10px; }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="dot"></div>
    Cancha<span style="color:var(--accent2);font-weight:900">Libre</span>
  </div>
  <div class="nav-links">
    <a href="/" onclick="if(history.length>1&&document.referrer){event.preventDefault();history.back()}">← Volver</a>
  </div>
</nav>

<div id="app"><div style="text-align:center;padding:80px;color:#9ca3af">Cargando...</div></div>

<script>
const SPORT_LABELS = { padel:'Pádel', futbol5:'Fútbol 5', futbol7:'Fútbol 7', futbol11:'Fútbol 11', hockey:'Hockey', tenis:'Tenis' };
const SPORT_ICONS  = { padel:'🎾', futbol5:'⚽', futbol7:'⚽', futbol11:'🏟️', hockey:'🏑', tenis:'🎾' };
const SPORT_PRIORITY = ['padel','futbol5','futbol7','futbol11','hockey','tenis'];
const slug = location.pathname.replace('/complejo/','').replace(/\//g,'');

const DEFAULT_IMG = {
  padel:    '/img/padel-default.svg',
  futbol5:  '/img/padel-default.svg',
  futbol7:  '/img/padel-default.svg',
  futbol11: '/img/padel-default.svg',
  hockey:   '/img/padel-default.svg',
  tenis:    '/img/padel-default.svg',
};

async function load() {
  const res = await fetch(`/api/venues/${slug}`);
  if (!res.ok) {
    document.getElementById('app').innerHTML = `<div class="empty-state"><div class="icon">😕</div><h3>Complejo no encontrado</h3><br><a href="/" class="btn btn-primary">Volver</a></div>`;
    return;
  }
  const data = await res.json();
  document.title = `${data.name} — Cancha Libre`;
  render(data);
}

function render(d) {
  const waLink = d.whatsapp
    ? `https://wa.me/${d.whatsapp.replace(/\D/g,'')}?text=${encodeURIComponent(`Hola! Vi tu complejo ${d.name} en Cancha Libre y quería consultar.`)}`
    : null;

  const waBar = waLink ? `
    <div class="wa-bar">
      <a href="${waLink}" target="_blank">
        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Consultar por WhatsApp
      </a>
    </div>` : '';

  // Agrupar canchas por deporte
  const bySport = {};
  for (const c of d.courts) {
    if (!bySport[c.sport]) bySport[c.sport] = [];
    bySport[c.sport].push(c);
  }
  const sortedSports = Object.entries(bySport).sort(([a],[b]) => {
    const ia = SPORT_PRIORITY.indexOf(a), ib = SPORT_PRIORITY.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1; if (ib !== -1) return 1;
    return a.localeCompare(b,'es');
  });

  const courtsHtml = sortedSports.map(([sport, courts]) => `
    <div class="sport-section">
      <div class="sport-section-header">
        <span class="sport-icon">${SPORT_ICONS[sport] || '🏟️'}</span>
        <h3>${SPORT_LABELS[sport] || sport}</h3>
        <span class="count">${courts.length} cancha${courts.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="courts-grid">
        ${courts.map(c => {
          const SURF = { sintetico:'🌿 Sintético', acrilico:'🔵 Acrílico', cemento:'⬜ Cemento', parquet:'🪵 Parquet', tierra:'🟤 Tierra' };
          const WALL = { vidrio:'🪟 Vidrio', solido:'🧱 Sólida', mixto:'🪟🧱 Mixta' };
          const tags = [];
          if (c.surface) tags.push({ text: SURF[c.surface] || c.surface, cls: '' });
          tags.push(c.covered ? { text:'🏠 Techada', cls:'highlight' } : { text:'☀️ Al aire libre', cls:'' });
          if (c.wall_material && sport === 'padel') tags.push({ text: WALL[c.wall_material] || c.wall_material, cls:'' });

          const mainImg = c.images?.[0]
            ? `<img class="court-img" src="/uploads/${c.images[0].path}" alt="${c.name}">`
            : d.cover_image
              ? `<img class="court-img" src="/uploads/${d.cover_image}" alt="${d.name}">`
              : `<img class="court-default" src="${DEFAULT_IMG[sport] || '/img/padel-default.svg'}" alt="Cancha">`;

          const extraImgs = c.images?.length > 1
            ? `<div class="gallery">${c.images.slice(1).map(i => `<img src="/uploads/${i.path}" alt="">`).join('')}</div>`
            : '';

          return `
            <div class="court-card">
              ${mainImg}
              ${extraImgs}
              <div class="court-body">
                <h3>${c.name}</h3>
                <div class="court-tags">${tags.map(t => `<span class="court-tag ${t.cls}">${t.text}</span>`).join('')}</div>
                ${c.description ? `<div class="court-desc">${c.description}</div>` : ''}
                ${c.price_per_hour ? `<div class="court-price">$${Number(c.price_per_hour).toLocaleString('es-AR')}<span> / hora</span></div>` : ''}
              </div>
            </div>`;
        }).join('')}
      </div>
    </div>
  `).join('');

  const amenitiesHtml = d.amenities.length ? `
    <div class="section-title">✨ Servicios e instalaciones</div>
    <div class="amenities-grid">
      ${d.amenities.map(a => `
        <div class="amenity-chip">
          <div class="icon">${a.icon || '✨'}</div>
          <div class="name">${a.name}</div>
          ${a.description ? `<div class="desc">${a.description}</div>` : ''}
          ${a.bookable ? `<div class="price-tag">${a.price ? '$' + Number(a.price).toLocaleString('es-AR') : 'Reservable'}</div>` : ''}
        </div>`).join('')}
    </div>` : '';

  document.getElementById('app').innerHTML = `
    <div class="venue-hero">
      ${d.cover_image
        ? `<img src="/uploads/${d.cover_image}" alt="${d.name}">`
        : `<img src="/img/padel-default.svg" alt="Cancha Libre">`}
      <div class="overlay"></div>
      <div class="hero-content">
        <h1>${d.name}</h1>
        ${d.address ? `<div class="address">📍 ${d.address}</div>` : ''}
      </div>
    </div>
    ${waBar}
    <div class="venue-body">
      ${d.description ? `<p style="font-size:1rem;line-height:1.8;color:var(--text-muted);margin-bottom:32px">${d.description}</p>` : ''}
      ${amenitiesHtml}
      ${courtsHtml}
    </div>
  `;
}

load();
</script>
</body>
</html>
