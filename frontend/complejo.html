<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complejo — Chilecito Deportes</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .gallery { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 10px; scrollbar-width: thin; }
    .gallery img { height: 180px; width: 260px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
    .contact-bar { background: var(--primary-dark); color: white; padding: 14px 24px; display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }
    .contact-bar a { color: white; display: flex; align-items: center; gap: 6px; font-weight: 700; padding: 8px 18px; border-radius: 8px; background: rgba(255,255,255,0.12); transition: background 0.2s; font-size: 0.9rem; }
    .contact-bar a:hover { background: rgba(255,255,255,0.22); }
    .contact-bar a.wa { background: #25D366; }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="dot"></div>
    <a href="/">Chilecito <span style="color:var(--accent2)">Deportes</span></a>
  </div>
  <div class="nav-links">
    <a href="/" onclick="if(history.length>1&&document.referrer){event.preventDefault();history.back()}">← Volver</a>
  </div>
</nav>

<div id="app"><div style="text-align:center;padding:80px;color:#9ca3af">Cargando...</div></div>

<script>
const SPORT_LABELS = { padel:'Pádel', futbol5:'Fútbol 5', futbol7:'Fútbol 7', futbol11:'Fútbol 11', hockey:'Hockey', voley:'Vóley' };
const SPORT_ICONS  = { padel:'🎾', futbol5:'⚽', futbol7:'⚽', futbol11:'🏟️', hockey:'🏑', voley:'🏐' };
const slug = location.pathname.replace('/complejo/', '').replace(/\//g,'');

async function load() {
  const res = await fetch(`/api/venues/${slug}`);
  if (!res.ok) { document.getElementById('app').innerHTML = `<div class="empty-state"><div class="icon">😕</div><h3>Complejo no encontrado</h3><br><a href="/" class="btn btn-primary">Volver</a></div>`; return; }
  const data = await res.json();
  document.title = `${data.name} — Chilecito Deportes`;
  render(data);
}

function render(d) {
  const contacts = [];
  if (d.phone) contacts.push(`<a href="tel:${d.phone}">📞 ${d.phone}</a>`);
  if (d.whatsapp) contacts.push(`<a class="wa" href="https://wa.me/${d.whatsapp.replace(/\D/g,'')}" target="_blank">💬 WhatsApp</a>`);

  // Agrupar canchas por deporte — pádel primero, luego resto alfabético
  const SPORT_PRIORITY = ['padel','futbol5','futbol7','futbol11','hockey','voley'];
  const bySport = {};
  for (const c of d.courts) { if (!bySport[c.sport]) bySport[c.sport] = []; bySport[c.sport].push(c); }
  const sortedSports = Object.entries(bySport).sort(([a],[b]) => {
    const ia = SPORT_PRIORITY.indexOf(a), ib = SPORT_PRIORITY.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1; if (ib !== -1) return 1;
    return a.localeCompare(b,'es');
  });

  const courtsHtml = sortedSports.map(([sport, courts]) => `
    <div class="sport-section">
      <div class="sport-section-header">
        <span class="sport-icon">${SPORT_ICONS[sport] || '🏟️'}</span>
        <h3>${SPORT_LABELS[sport] || sport}</h3>
        <span class="count">${courts.length} cancha${courts.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="courts-grid">
        ${courts.map(c => {
          const tags = [];
          if (c.surface) { const map={sintetico:'🌿 Pasto sintético',acrilico:'🔵 Acrílico',cemento:'⬜ Cemento',parquet:'🪵 Parquet',tierra:'🟤 Tierra'}; tags.push({text:map[c.surface]||c.surface,cls:''}); }
          if (c.covered) tags.push({text:'🏠 Techada',cls:'highlight'});
          else tags.push({text:'☀️ Al aire libre',cls:''});
          if (c.wall_material && sport==='padel') { const map={vidrio:'🪟 Pared vidrio',solido:'🧱 Pared sólida',mixto:'🪟🧱 Vidrio + sólida'}; tags.push({text:map[c.wall_material]||c.wall_material,cls:''}); }
          const firstImg = c.images?.[0];
          return `
            <div class="court-card">
              ${firstImg ? `<img class="court-img" src="/uploads/${firstImg.path}" alt="${c.name}">` : `<div class="court-no-img">${SPORT_ICONS[sport]||'🏟️'}</div>`}
              ${c.images?.length>1 ? `<div class="gallery" style="padding:8px 12px 4px">${c.images.slice(1).map(i=>`<img src="/uploads/${i.path}" alt="">`).join('')}</div>` : ''}
              <div class="court-body">
                <h3>${c.name}</h3>
                <div class="court-tags">${tags.map(t=>`<span class="court-tag ${t.cls||''}">${t.text}</span>`).join('')}</div>
                ${c.description ? `<p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:10px">${c.description}</p>` : ''}
                ${c.price_per_hour ? `<div class="court-price">$${Number(c.price_per_hour).toLocaleString('es-AR')}<span>/hora</span></div>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `).join('');

  const amenitiesHtml = d.amenities.length ? `
    <h2 class="section-title" style="margin-top:40px">✨ Servicios e instalaciones</h2>
    <div class="amenities-grid">
      ${d.amenities.map(a => `
        <div class="amenity-chip">
          <div class="icon">${a.icon || '✨'}</div>
          <div class="name">${a.name}</div>
          ${a.description ? `<div class="desc">${a.description}</div>` : ''}
          ${a.bookable && a.price ? `<div class="price-tag">$${Number(a.price).toLocaleString('es-AR')}</div>` : ''}
          ${a.bookable && !a.price ? `<div class="price-tag">Reservable</div>` : ''}
        </div>
      `).join('')}
    </div>
  ` : '';

  document.getElementById('app').innerHTML = `
    <div class="venue-hero">
      ${d.cover_image ? `<img src="/uploads/${d.cover_image}" alt="${d.name}">` : ''}
      <div class="overlay"></div>
      <div class="hero-content">
        <h1>${d.name}</h1>
        ${d.address ? `<div class="address">📍 ${d.address}</div>` : ''}
      </div>
    </div>
    ${contacts.length ? `<div class="contact-bar">${contacts.join('')}</div>` : ''}
    <div class="container">
      ${d.description ? `<p style="font-size:1rem;line-height:1.8;color:var(--text-muted);margin-bottom:36px">${d.description}</p>` : ''}
      ${amenitiesHtml}
      ${courtsHtml}
    </div>
  `;
}

load();
</script>
</body>
</html>
