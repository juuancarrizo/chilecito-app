<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#1a3f62"/>
    </linearGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b6b42"/>
      <stop offset="100%" stop-color="#145433"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="480" height="300" fill="url(#bg)"/>

  <!-- Sombra de la cancha -->
  <rect x="75" y="68" width="330" height="190" rx="4" fill="rgba(0,0,0,0.35)"/>

  <!-- Superficie de la cancha -->
  <rect x="70" y="62" width="340" height="186" rx="4" fill="url(#court)"/>

  <!-- Líneas de la cancha (blanco) -->
  <!-- Borde exterior -->
  <rect x="70" y="62" width="340" height="186" rx="4" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5"/>

  <!-- Red central (horizontal) -->
  <line x1="70" y1="155" x2="410" y2="155" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>

  <!-- Postes de la red -->
  <rect x="67" y="148" width="6" height="14" rx="2" fill="rgba(255,255,255,0.7)"/>
  <rect x="407" y="148" width="6" height="14" rx="2" fill="rgba(255,255,255,0.7)"/>

  <!-- Línea de saque - lado A -->
  <line x1="70" y1="105" x2="410" y2="105" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>
  <line x1="240" y1="62" x2="240" y2="105" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>

  <!-- Línea de saque - lado B -->
  <line x1="70" y1="205" x2="410" y2="205" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>
  <line x1="240" y1="205" x2="240" y2="248" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>

  <!-- Paredes de vidrio - superior -->
  <rect x="70" y="58" width="340" height="8" rx="2" fill="rgba(120,210,255,0.18)" stroke="rgba(150,220,255,0.5)" stroke-width="1"/>
  <!-- Paredes de vidrio - inferior -->
  <rect x="70" y="242" width="340" height="8" rx="2" fill="rgba(120,210,255,0.18)" stroke="rgba(150,220,255,0.5)" stroke-width="1"/>
  <!-- Paredes de vidrio - izquierda -->
  <rect x="62" y="62" width="10" height="186" rx="2" fill="rgba(120,210,255,0.18)" stroke="rgba(150,220,255,0.5)" stroke-width="1"/>
  <!-- Paredes de vidrio - derecha -->
  <rect x="408" y="62" width="10" height="186" rx="2" fill="rgba(120,210,255,0.18)" stroke="rgba(150,220,255,0.5)" stroke-width="1"/>

  <!-- Pelotitas decorativas -->
  <circle cx="180" cy="120" r="6" fill="rgba(200,230,0,0.7)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <circle cx="300" cy="185" r="6" fill="rgba(200,230,0,0.7)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Etiqueta -->
  <text x="240" y="282" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">CANCHA LIBRE</text>
</svg>
