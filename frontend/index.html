<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancha Libre — Reservá tu deporte en La Rioja</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    /* ── LOCALIDADES CUADROS ─────────────────────────── */
    .loc-cards {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 22px 0 26px;
      flex-wrap: wrap;
    }
    .loc-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 130px;
      padding: 14px 12px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.07);
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      backdrop-filter: blur(4px);
    }
    .loc-card:hover { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.14); }
    .loc-card.active {
      border-color: var(--accent2);
      background: rgba(245,166,35,0.2);
      box-shadow: 0 4px 20px rgba(245,166,35,0.25);
    }
    .loc-card.pronto {
      opacity: 0.45;
      cursor: default;
      border-style: dashed;
    }
    .loc-card.pronto:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.07); }
    .loc-card .loc-icon { font-size: 1.5rem; }
    .loc-card .loc-name { font-size: 0.82rem; font-weight: 800; letter-spacing: 0.2px; }
    .loc-card .loc-sub { font-size: 0.68rem; opacity: 0.7; font-weight: 500; }

    /* ── SEARCH ROW ──────────────────────────────────── */
    .search-row {
      display: flex; gap: 10px; align-items: center;
      justify-content: center; flex-wrap: wrap;
      max-width: 600px; margin: 0 auto;
    }
    .search-row input, .search-row select {
      padding: 12px 16px; border-radius: 10px; border: none;
      font-size: 0.95rem; background: white; color: var(--text); outline: none; font-weight: 500;
    }
    .search-row input[type="date"] { min-width: 160px; }
    .search-row select { min-width: 130px; }
    .search-row .btn-search {
      padding: 12px 28px; background: var(--accent); color: white; border: none;
      border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .search-row .btn-search:hover { background: #d63651; transform: translateY(-1px); }

    /* ── SLOTS DISPONIBLES ───────────────────────────────── */
    .other-slots {
      margin-bottom: 12px;
      padding: 10px 12px;
      background: var(--bg);
      border-radius: 10px;
    }
    .other-slots-label {
      font-size: 0.73rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .other-slots-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .slot-chip {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      background: white;
      border: 1.5px solid var(--border);
      color: var(--primary);
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }
    .slot-chip:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="dot"></div>
    Cancha<span style="color:var(--accent2);font-weight:900">Libre</span>
  </div>
  <div class="nav-links">
    <a href="/">Inicio</a>
    <a href="/login.html" class="nav-cta">Soy propietario</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <div class="hero-eyebrow">⚡ La Rioja, Argentina</div>
    <h1>Encontrá tu cancha <span>disponible</span></h1>

    <!-- LOCALIDADES -->
    <div class="loc-cards">
      <div class="loc-card active" id="loc-chilecito" onclick="selectCity('Chilecito', this)">
        <div class="loc-icon">📍</div>
        <div class="loc-name">Chilecito</div>
        <div class="loc-sub">Disponible</div>
      </div>
      <div class="loc-card pronto">
        <div class="loc-icon">🏔️</div>
        <div class="loc-name">Toda La Rioja</div>
        <div class="loc-sub">Próximamente</div>
      </div>
    </div>

    <!-- DEPORTES -->
    <div class="sports-grid" id="sportsGrid">
      <div style="color:rgba(255,255,255,0.5);font-size:0.9rem">Cargando deportes...</div>
    </div>

    <!-- FECHA / HORA -->
    <div class="search-row" id="searchRow" style="display:none;margin-top:20px">
      <input type="date" id="searchDate">
      <select id="searchTime"></select>
      <select id="searchDuration">
        <option value="60">1 hora</option>
        <option value="90">1h 30min</option>
        <option value="120">2 horas</option>
      </select>
      <button class="btn-search" onclick="doSearch()">🔍 Buscar</button>
    </div>
  </div>
</div>

<!-- RESULTADOS -->
<div class="container" id="resultsSection" style="display:none">
  <div id="resultsContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let selectedSport = null;
let selectedCity  = 'Chilecito';
let sportsData    = [];

// ── Init ──────────────────────────────────────────────────────
async function init() {
  buildTimeSelect();
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('searchDate').value = today;
  document.getElementById('searchDate').min   = today;
  await loadSports();
}

function selectCity(city, el) {
  selectedCity = city;
  document.querySelectorAll('.loc-card:not(.pronto)').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
}

async function loadSports() {
  const res = await fetch('/api/sports');
  sportsData = await res.json();
  buildSports();
}

function buildSports() {
  const grid = document.getElementById('sportsGrid');
  if (!sportsData.length) { grid.innerHTML = '<div style="color:rgba(255,255,255,0.5)">Sin deportes configurados</div>'; return; }
  grid.innerHTML = sportsData.map(s => `
    <button class="sport-btn" data-sport="${s.key}" onclick="selectSport('${s.key}')">
      <span class="sport-icon">${s.icon}</span>
      <span class="sport-label">${s.label}</span>
    </button>
  `).join('');
}

function buildTimeSelect() {
  const sel = document.getElementById('searchTime');
  const curH = new Date().getHours();
  for (let h = 6; h <= 23; h++) {
    for (const m of [0, 30]) {
      const label = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      const opt = document.createElement('option');
      opt.value = label; opt.textContent = label;
      if (h === curH && m === 0) opt.selected = true;
      sel.appendChild(opt);
    }
  }
}

function selectSport(sport) {
  selectedSport = sport;
  document.querySelectorAll('.sport-btn').forEach(b => b.classList.toggle('active', b.dataset.sport === sport));
  document.getElementById('searchRow').style.display = 'flex';
}

// ── Búsqueda ──────────────────────────────────────────────────
async function doSearch() {
  if (!selectedSport) { showToast('Seleccioná un deporte primero', 'error'); return; }
  const date       = document.getElementById('searchDate').value;
  const start_time = document.getElementById('searchTime').value;
  const duration   = document.getElementById('searchDuration').value;
  if (!date) { showToast('Seleccioná una fecha', 'error'); return; }

  const cityParam = selectedCity ? `&city=${encodeURIComponent(selectedCity)}` : '';
  const res  = await fetch(`/api/search?sport=${selectedSport}&date=${date}&start_time=${start_time}&duration=${duration}${cityParam}`);
  const data = await res.json();
  renderResults(data, start_time);
  document.getElementById('resultsSection').style.display = 'block';
  document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderResults(data, start_time) {
  const sport = sportsData.find(s => s.key === selectedSport) || { label: selectedSport, icon: '🏟️' };
  const dateLabel = new Date(data.search.date + 'T12:00:00').toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
  const el = document.getElementById('resultsContent');

  let html = `
    <div class="results-header">
      <h2>${sport.icon} ${sport.label} — ${dateLabel}</h2>
      <span class="tag">${start_time} a ${data.search.end_time}</span>
    </div>
  `;

  if (data.available.length) {
    html += `<p style="color:var(--text-muted);font-size:0.88rem;margin-bottom:20px">${data.available.length} cancha${data.available.length !== 1 ? 's' : ''} disponible${data.available.length !== 1 ? 's' : ''}</p>
    <div class="courts-grid">${data.available.map(c => courtCard(c, start_time, data.search.end_time)).join('')}</div>`;
  } else {
    html += `<div class="empty-state" style="padding:40px 0">
      <div class="icon">😔</div>
      <h3>No hay canchas disponibles a las ${start_time}</h3>
      <p>Probá con otro horario o día</p>
    </div>`;

    if (data.suggestions.length) {
      html += `<div class="suggestions-box">
        <h3>⏰ Horarios cercanos disponibles</h3>
        <p>Encontramos canchas libres en estos horarios</p>
        <div class="suggestion-slots">
          ${data.suggestions.map(s => `
            <div class="suggestion-slot" onclick="jumpToTime('${s.time}')">
              <div class="slot-time">${s.time}</div>
              <div class="slot-count">${s.count} cancha${s.count !== 1 ? 's' : ''}</div>
            </div>`).join('')}
        </div>
      </div>`;
    }
  }

  el.innerHTML = html;
}

function courtCard(c, start_time, end_time) {
  const SURFACES = { sintetico:'🌿 Sintético', acrilico:'🔵 Acrílico', cemento:'⬜ Cemento', parquet:'🪵 Parquet', tierra:'🟤 Tierra' };
  const WALLS    = { vidrio:'🪟 Pared vidrio', solido:'🧱 Pared sólida', mixto:'🪟🧱 Vidrio + sólida' };
  const tags = [];
  if (c.surface) tags.push({ text: SURFACES[c.surface] || c.surface, cls: '' });
  tags.push(c.covered ? { text: '🏠 Techada', cls: 'highlight' } : { text: '☀️ Al aire libre', cls: '' });
  if (c.wall_material && c.sport === 'padel') tags.push({ text: WALLS[c.wall_material] || c.wall_material, cls: '' });

  const wa = c.venue_whatsapp
    ? `https://wa.me/${c.venue_whatsapp.replace(/\D/g,'')}?text=${encodeURIComponent(`Hola! Quiero reservar ${c.name} el ${start_time} hs`)}`
    : null;
  const sport = sportsData.find(s => s.key === c.sport);

  // Calcular otros horarios disponibles en el día (cada 1h de 8 a 22)
  const otherSlots = [];
  for (let h = 8; h <= 22; h++) {
    const slotStart = `${String(h).padStart(2,'0')}:00`;
    const slotEnd   = `${String(h+1).padStart(2,'0')}:00`;
    if (slotStart === start_time) continue; // ya es el horario buscado
    const ocupado = (c.occupied_today || []).some(os => os.start_time < slotEnd && os.end_time > slotStart);
    if (!ocupado) otherSlots.push(slotStart);
  }
  const slotsHtml = otherSlots.length
    ? `<div class="other-slots">
        <div class="other-slots-label">🕐 Más horarios libres</div>
        <div class="other-slots-chips">
          ${otherSlots.slice(0, 8).map(t => {
            const waSlot = c.venue_whatsapp
              ? `https://wa.me/${c.venue_whatsapp.replace(/\D/g,'')}?text=${encodeURIComponent(`Hola! Quiero reservar ${c.name} a las ${t} hs`)}`
              : null;
            return `<a class="slot-chip" ${waSlot ? `href="${waSlot}" target="_blank"` : `onclick="jumpToTime('${t}')"`}>${t}</a>`;
          }).join('')}
        </div>
      </div>`
    : '';

  return `<div class="court-card">
    ${c.images?.[0] ? `<img class="court-img" src="/uploads/${c.images[0].path}" alt="${c.name}">` : `<div class="court-no-img">${sport?.icon || '🏟️'}</div>`}
    <div class="court-body">
      <div class="court-venue">${c.venue_name}${c.venue_city ? ` · ${c.venue_city}` : ''}</div>
      <h3>${c.name}</h3>
      <div class="court-tags">${tags.map(t => `<span class="court-tag ${t.cls||''}">${t.text}</span>`).join('')}</div>
      <div class="court-bottom">
        ${c.price_per_hour ? `<div class="court-price" style="margin-bottom:12px">$${Number(c.price_per_hour).toLocaleString('es-AR')}<span>/hora</span></div>` : ''}
        ${slotsHtml}
        <div class="court-footer">
          ${wa ? `<a class="btn-wa" href="${wa}" target="_blank">💬 Reservar</a>` : ''}
          <a class="btn-info" href="/complejo/${c.venue_slug}">Ver complejo</a>
        </div>
      </div>
    </div>
  </div>`;
}

function jumpToTime(time) {
  document.getElementById('searchTime').value = time;
  // Forzar re-render limpio antes de buscar
  document.getElementById('resultsContent').innerHTML = '<div style="text-align:center;padding:32px;color:var(--text-muted)">Buscando...</div>';
  doSearch();
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.className = 'toast', 2800);
}

init();
</script>
</body>
</html>
