<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancha Libre — Reservá tu deporte en La Rioja</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    /* ── LOCALIDADES CUADROS ─────────────────────────── */
    .loc-cards {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 22px 0 26px;
      flex-wrap: wrap;
    }
    .loc-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 130px;
      padding: 14px 12px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.07);
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      backdrop-filter: blur(4px);
    }
    .loc-card:hover { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.14); }
    .loc-card.active {
      border-color: var(--accent2);
      background: rgba(245,166,35,0.2);
      box-shadow: 0 4px 20px rgba(245,166,35,0.25);
    }
    .loc-card.pronto {
      opacity: 0.45;
      cursor: default;
      border-style: dashed;
    }
    .loc-card.pronto:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.07); }
    .loc-card .loc-icon { font-size: 1.8rem; }
    .loc-card .loc-name { font-size: 0.85rem; font-weight: 800; letter-spacing: 0.2px; }
    .loc-card .loc-sub { font-size: 0.68rem; opacity: 0.7; font-weight: 500; }

    /* Cuadro "coming soon" — más chico */
    .loc-card-sm { width: 96px; padding: 10px 8px; }
    .loc-icon-sm { font-size: 1.1rem; }
    .loc-name-sm { font-size: 0.72rem; }

    /* ── SEARCH ROW ──────────────────────────────────── */
    .search-row {
      display: flex; gap: 10px; align-items: center;
      justify-content: center; flex-wrap: wrap;
      max-width: 600px; margin: 0 auto;
    }
    .search-row input, .search-row select {
      padding: 12px 16px; border-radius: 10px; border: none;
      font-size: 0.95rem; background: white; color: var(--text); outline: none; font-weight: 500;
    }
    .search-row input[type="date"] { min-width: 160px; }
    .search-row select { min-width: 130px; }
    .search-row .btn-search {
      padding: 12px 28px; background: var(--accent); color: white; border: none;
      border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .search-row .btn-search:hover { background: #d63651; transform: translateY(-1px); }

    /* ── SLOTS DISPONIBLES ───────────────────────────────── */
    .other-slots {
      margin-bottom: 12px;
      padding: 10px 12px;
      background: var(--bg);
      border-radius: 10px;
    }
    .other-slots-label {
      font-size: 0.73rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .other-slots-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .slot-chip {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      background: white;
      border: 1.5px solid var(--border);
      color: var(--primary);
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }
    .slot-chip:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .slot-chip.slot-active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .slot-chip.slot-occupied {
      background: #fde8ec;
      color: #c0392b;
      border-color: #f5b7b1;
      text-decoration: line-through;
      cursor: default;
      opacity: 0.8;
    }

    /* ── MODAL RESERVA ───────────────────────────────────── */
    .reserve-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 600;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .reserve-overlay.open { opacity: 1; pointer-events: all; }
    .reserve-sheet {
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 28px 24px 36px;
      width: 100%; max-width: 520px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(.32,.72,0,1);
    }
    .reserve-overlay.open .reserve-sheet { transform: translateY(0); }
    .reserve-handle {
      width: 40px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 0 auto 20px;
    }
    .reserve-court-info { margin-bottom: 20px; }
    .reserve-court-info .venue { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--primary); margin-bottom: 3px; }
    .reserve-court-info h3 { font-size: 1.15rem; font-weight: 900; margin-bottom: 6px; }
    .reserve-court-info .time-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--bg); border-radius: 8px; padding: 6px 12px;
      font-size: 0.88rem; font-weight: 700; color: var(--primary-dark);
    }
    .duration-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin: 18px 0 10px; }
    .duration-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .dur-chip {
      padding: 9px 16px; border-radius: 10px;
      border: 2px solid var(--border); background: white;
      font-size: 0.88rem; font-weight: 700; color: var(--text);
      cursor: pointer; transition: all 0.18s;
    }
    .dur-chip:hover { border-color: var(--primary); color: var(--primary); }
    .dur-chip.selected { background: var(--primary); border-color: var(--primary); color: white; }
    .reserve-summary {
      margin: 18px 0 20px; padding: 14px 16px;
      background: var(--bg); border-radius: 12px;
      font-size: 0.9rem; line-height: 1.7;
      display: none;
    }
    .reserve-summary.show { display: block; }
    .reserve-summary strong { color: var(--primary-dark); }
    .btn-wa-confirm {
      width: 100%; padding: 15px;
      background: #25D366; color: white; border: none;
      border-radius: 12px; font-size: 1rem; font-weight: 800;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.2s;
    }
    .btn-wa-confirm:hover { background: #1da851; }
    .btn-wa-confirm:disabled { background: var(--border); color: var(--text-muted); cursor: default; }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="dot"></div>
    Cancha<span style="color:var(--accent2);font-weight:900">Libre</span>
  </div>
  <div class="nav-links">
    <a href="/">Inicio</a>
    <a href="/login.html" class="nav-cta">Soy propietario</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <div class="hero-eyebrow">⚡ La Rioja, Argentina</div>
    <h1>Encontrá tu cancha <span>disponible</span></h1>

    <!-- LOCALIDADES -->
    <div class="loc-cards">
      <div class="loc-card active" id="loc-chilecito" onclick="selectCity('Chilecito', this)">
        <div class="loc-icon">🏔️</div>
        <div class="loc-name">Chilecito</div>
        <div class="loc-sub">Disponible</div>
      </div>
      <div class="loc-card pronto loc-card-sm">
        <div class="loc-icon loc-icon-sm">🔜</div>
        <div class="loc-name loc-name-sm">Toda La Rioja</div>
      </div>
    </div>

    <!-- DEPORTES -->
    <div class="sports-grid" id="sportsGrid">
      <div style="color:rgba(255,255,255,0.5);font-size:0.9rem">Cargando deportes...</div>
    </div>

    <!-- FECHA / HORA -->
    <div class="search-row" id="searchRow" style="display:none;margin-top:20px">
      <input type="date" id="searchDate">
      <select id="searchTime"></select>
      <button class="btn-search" onclick="doSearch()">🔍 Buscar</button>
    </div>
  </div>
</div>

<!-- RESULTADOS -->
<div class="container" id="resultsSection" style="display:none">
  <div id="resultsContent"></div>
</div>

<!-- MODAL RESERVA -->
<div class="reserve-overlay" id="reserveOverlay" onclick="closeReserveModal(event)">
  <div class="reserve-sheet">
    <div class="reserve-handle"></div>
    <div class="reserve-court-info">
      <div class="venue" id="rv-venue"></div>
      <h3 id="rv-court"></h3>
      <div class="time-badge">
        📅 <span id="rv-date"></span> &nbsp;·&nbsp; ⏰ <span id="rv-start"></span>
      </div>
    </div>

    <div class="duration-label">¿Cuánto tiempo vas a jugar?</div>
    <div class="duration-chips">
      <button class="dur-chip" onclick="selectDuration(60,this)">1 hs</button>
      <button class="dur-chip" onclick="selectDuration(90,this)">1:30 hs</button>
      <button class="dur-chip" onclick="selectDuration(120,this)">2 hs</button>
      <button class="dur-chip" onclick="selectDuration(150,this)">2:30 hs</button>
      <button class="dur-chip" onclick="selectDuration(180,this)">3 hs</button>
    </div>

    <div class="reserve-summary" id="rv-summary"></div>

    <button class="btn-wa-confirm" id="rv-btn" disabled onclick="confirmReserve()">
      💬 Consultar disponibilidad por WhatsApp
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let selectedSport   = null;
let selectedCity    = 'Chilecito';
let sportsData      = [];
let availableCourts = [];   // se llena en renderResults
let reserveCtx      = {};   // datos del modal activo
let selectedDurMin  = null;

// ── Init ──────────────────────────────────────────────────────
async function init() {
  buildTimeSelect();
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('searchDate').value = today;
  document.getElementById('searchDate').min   = today;
  await loadSports();
}

function selectCity(city, el) {
  selectedCity = city;
  document.querySelectorAll('.loc-card:not(.pronto)').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
}

async function loadSports() {
  const res = await fetch('/api/sports');
  sportsData = await res.json();
  buildSports();
}

function buildSports() {
  const grid = document.getElementById('sportsGrid');
  if (!sportsData.length) { grid.innerHTML = '<div style="color:rgba(255,255,255,0.5)">Sin deportes configurados</div>'; return; }
  grid.innerHTML = sportsData.map(s => `
    <button class="sport-btn" data-sport="${s.key}" onclick="selectSport('${s.key}')">
      <span class="sport-icon">${s.icon}</span>
      <span class="sport-label">${s.label}</span>
    </button>
  `).join('');
}

function buildTimeSelect() {
  const sel = document.getElementById('searchTime');
  const curH = new Date().getHours();
  for (let h = 6; h <= 23; h++) {
    for (const m of [0, 30]) {
      const label = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      const opt = document.createElement('option');
      opt.value = label; opt.textContent = label;
      if (h === curH && m === 0) opt.selected = true;
      sel.appendChild(opt);
    }
  }
}

function selectSport(sport) {
  selectedSport = sport;
  document.querySelectorAll('.sport-btn').forEach(b => b.classList.toggle('active', b.dataset.sport === sport));
  document.getElementById('searchRow').style.display = 'flex';
}

// ── Búsqueda ──────────────────────────────────────────────────
async function doSearch() {
  if (!selectedSport) { showToast('Seleccioná un deporte primero', 'error'); return; }
  const date       = document.getElementById('searchDate').value;
  const start_time = document.getElementById('searchTime').value;
  if (!date) { showToast('Seleccioná una fecha', 'error'); return; }

  const cityParam = selectedCity ? `&city=${encodeURIComponent(selectedCity)}` : '';
  // duration fijo 60 para chequear disponibilidad (la duración real la elige el usuario al reservar)
  const res  = await fetch(`/api/search?sport=${selectedSport}&date=${date}&start_time=${start_time}&duration=60${cityParam}`);
  const data = await res.json();
  renderResults(data, start_time);
  document.getElementById('resultsSection').style.display = 'block';
  document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderResults(data, start_time) {
  const sport = sportsData.find(s => s.key === selectedSport) || { label: selectedSport, icon: '🏟️' };
  const dateLabel = new Date(data.search.date + 'T12:00:00').toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
  const el = document.getElementById('resultsContent');

  let html = `
    <div class="results-header">
      <h2>${sport.icon} ${sport.label} — ${dateLabel}</h2>
    </div>
  `;

  // Unir disponibles + ocupadas en un solo array para el modal
  availableCourts = [...data.available, ...data.occupied];

  if (data.available.length) {
    html += `<p style="color:var(--text-muted);font-size:0.88rem;margin-bottom:20px">${data.available.length} cancha${data.available.length !== 1 ? 's' : ''} disponible${data.available.length !== 1 ? 's' : ''} a las ${start_time}</p>
    <div class="courts-grid">${data.available.map((c, i) => courtCard(c, i, start_time, data.search.date, false)).join('')}</div>`;
  } else {
    html += `<div class="empty-state" style="padding:40px 0">
      <div class="icon">😔</div>
      <h3>No hay canchas disponibles a las ${start_time}</h3>
      <p>Probá con otro horario o día</p>
    </div>`;

    if (data.suggestions.length) {
      html += `<div class="suggestions-box">
        <h3>⏰ Horarios cercanos disponibles</h3>
        <p>Encontramos canchas libres en estos horarios</p>
        <div class="suggestion-slots">
          ${data.suggestions.map(s => `
            <div class="suggestion-slot" onclick="jumpToTime('${s.time}')">
              <div class="slot-time">${s.time}</div>
              <div class="slot-count">${s.count} cancha${s.count !== 1 ? 's' : ''}</div>
            </div>`).join('')}
        </div>
      </div>`;
    }
  }

  // Canchas ocupadas en ese horario pero con otros turnos libres
  if (data.occupied.length) {
    const offset = data.available.length;
    html += `
      <div style="margin-top:32px">
        <p style="font-size:0.88rem;color:var(--text-muted);margin-bottom:16px">
          🚫 ${data.occupied.length} cancha${data.occupied.length !== 1 ? 's' : ''} ocupada${data.occupied.length !== 1 ? 's' : ''} a las ${start_time} — otros horarios disponibles:
        </p>
        <div class="courts-grid">
          ${data.occupied.map((c, i) => courtCard(c, offset + i, start_time, data.search.date, true)).join('')}
        </div>
      </div>`;
  }

  el.innerHTML = html;
}

function courtCard(c, idx, start_time, date, isOccupied = false) {
  const SURFACES = { sintetico:'🌿 Sintético', acrilico:'🔵 Acrílico', cemento:'⬜ Cemento', parquet:'🪵 Parquet', tierra:'🟤 Tierra' };
  const WALLS    = { vidrio:'🪟 Pared vidrio', solido:'🧱 Pared sólida', mixto:'🪟🧱 Vidrio + sólida' };
  const tags = [];
  if (c.surface) tags.push({ text: SURFACES[c.surface] || c.surface, cls: '' });
  tags.push(c.covered ? { text: '🏠 Techada', cls: 'highlight' } : { text: '☀️ Al aire libre', cls: '' });
  if (c.wall_material && c.sport === 'padel') tags.push({ text: WALLS[c.wall_material] || c.wall_material, cls: '' });

  const sport = sportsData.find(s => s.key === c.sport);

  // 5 horarios siguientes disponibles desde el horario buscado
  // Si la cancha está ocupada: el chip del horario buscado aparece tachado, luego los 5 libres
  const [sh, sm] = start_time.split(':').map(Number);
  const searchMins = sh * 60 + sm;
  const freeSlots = [];

  // Chip especial para el horario buscado si está ocupada
  const occupiedChip = isOccupied
    ? `<button class="slot-chip slot-occupied" disabled>${start_time}</button>`
    : '';

  // Ventana: -2h hasta +4h desde el horario buscado (saltar el buscado en canchas ocupadas)
  for (let delta = -120; delta <= 240; delta += 60) {
    if (isOccupied && delta === 0) continue; // ya se muestra como chip tachado
    const mins = searchMins + delta;
    if (mins < 6 * 60 || mins > 23 * 60) continue;
    const slotH     = Math.floor(mins / 60);
    const slotStart = `${String(slotH).padStart(2,'0')}:00`;
    const slotEnd   = `${String(slotH + 1).padStart(2,'0')}:00`;
    const ocupado   = (c.occupied_today || []).some(os => os.start_time < slotEnd && os.end_time > slotStart);
    if (!ocupado) freeSlots.push({ time: slotStart, isActive: delta === 0 });
  }

  const slotsHtml = (occupiedChip || freeSlots.length)
    ? `<div class="other-slots">
        <div class="other-slots-label">${isOccupied ? '🚫 Ocupada · otros horarios:' : '🕐 Horarios disponibles'}</div>
        <div class="other-slots-chips">
          ${occupiedChip}
          ${freeSlots.map(s =>
            `<button class="slot-chip${s.isActive ? ' slot-active' : ''}" onclick="openReserveModal(${idx},'${s.time}','${date}')">${s.time}</button>`
          ).join('')}
        </div>
      </div>`
    : '';

  // Imagen: foto de cancha → portada del complejo → emoji
  const imgHtml = c.images?.[0]
    ? `<img class="court-img" src="/uploads/${c.images[0].path}" alt="${c.name}">`
    : c.venue_cover
      ? `<img class="court-img" src="/uploads/${c.venue_cover}" alt="${c.venue_name}">`
      : `<div class="court-no-img">${sport?.icon || '🏟️'}</div>`;

  return `<div class="court-card">
    ${imgHtml}
    <div class="court-body">
      <div class="court-venue">${c.venue_name}${c.venue_city ? ` · ${c.venue_city}` : ''}</div>
      <h3>${c.name}</h3>
      <div class="court-tags">${tags.map(t => `<span class="court-tag ${t.cls||''}">${t.text}</span>`).join('')}</div>
      <div class="court-bottom">
        ${c.price_per_hour ? `<div class="court-price" style="margin-bottom:12px">$${Number(c.price_per_hour).toLocaleString('es-AR')}<span>/hora</span></div>` : ''}
        ${slotsHtml}
        <div class="court-footer">
          <button class="btn-wa" onclick="openReserveModal(${idx},'${start_time}','${date}')">💬 Reservar</button>
          <a class="btn-info" href="/complejo/${c.venue_slug}">Ver complejo</a>
        </div>
      </div>
    </div>
  </div>`;
}

function jumpToTime(time) {
  document.getElementById('searchTime').value = time;
  // Forzar re-render limpio antes de buscar
  document.getElementById('resultsContent').innerHTML = '<div style="text-align:center;padding:32px;color:var(--text-muted)">Buscando...</div>';
  doSearch();
}

// ── Modal de reserva ──────────────────────────────────────────
function openReserveModal(idx, startTime, date) {
  const c = availableCourts[idx];
  if (!c) return;

  reserveCtx = { c, startTime, date };
  selectedDurMin = null;

  // Resetear chips
  document.querySelectorAll('.dur-chip').forEach(ch => ch.classList.remove('selected'));
  document.getElementById('rv-summary').classList.remove('show');
  document.getElementById('rv-btn').disabled = true;

  // Rellenar info
  document.getElementById('rv-venue').textContent = `${c.venue_name}${c.venue_city ? ' · ' + c.venue_city : ''}`;
  document.getElementById('rv-court').textContent = c.name;
  const dateLabel = new Date(date + 'T12:00:00').toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('rv-date').textContent = dateLabel;
  document.getElementById('rv-start').textContent = startTime;

  document.getElementById('reserveOverlay').classList.add('open');
}

function closeReserveModal(e) {
  if (e && e.target !== document.getElementById('reserveOverlay')) return;
  document.getElementById('reserveOverlay').classList.remove('open');
}

function selectDuration(minutes, btn) {
  selectedDurMin = minutes;
  document.querySelectorAll('.dur-chip').forEach(ch => ch.classList.remove('selected'));
  btn.classList.add('selected');

  const { c, startTime, date } = reserveCtx;
  const [h, m] = startTime.split(':').map(Number);
  const endMins = h * 60 + m + minutes;
  const endTime = `${String(Math.floor(endMins/60)).padStart(2,'0')}:${String(endMins%60).padStart(2,'0')}`;
  const durLabel = minutes === 60 ? '1 hora' : minutes === 90 ? '1:30 hs' : minutes === 120 ? '2 horas' : minutes === 150 ? '2:30 hs' : '3 horas';
  const dateLabel = new Date(date + 'T12:00:00').toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });

  const priceTotal = c.price_per_hour ? `$${Number(c.price_per_hour * minutes / 60).toLocaleString('es-AR')}` : null;

  document.getElementById('rv-summary').innerHTML = `
    <strong>${c.name}</strong> — ${c.venue_name}<br>
    📅 ${dateLabel}<br>
    ⏰ ${startTime} a ${endTime} hs · ${durLabel}
    ${priceTotal ? `<br>💰 Total estimado: <strong>${priceTotal}</strong>` : ''}
  `;
  document.getElementById('rv-summary').classList.add('show');
  document.getElementById('rv-btn').disabled = false;
}

function confirmReserve() {
  if (!selectedDurMin || !reserveCtx.c) return;
  const { c, startTime, date } = reserveCtx;
  const [h, m] = startTime.split(':').map(Number);
  const endMins = h * 60 + m + selectedDurMin;
  const endTime = `${String(Math.floor(endMins/60)).padStart(2,'0')}:${String(endMins%60).padStart(2,'0')}`;
  const durLabel = selectedDurMin === 60 ? '1 hora' : selectedDurMin === 90 ? '1:30 hs' : selectedDurMin === 120 ? '2 horas' : selectedDurMin === 150 ? '2:30 hs' : '3 horas';
  const dateLabel = new Date(date + 'T12:00:00').toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
  const priceTotal = c.price_per_hour ? `\n💰 Total estimado: $${Number(c.price_per_hour * selectedDurMin / 60).toLocaleString('es-AR')}` : '';
  const sport = sportsData.find(s => s.key === c.sport);

  const msg = `Hola! Me interesa reservar una cancha ${sport?.icon || ''}

📋 *${c.name}*
🏟️ ${c.venue_name}${c.venue_city ? ' · ' + c.venue_city : ''}
📅 ${dateLabel}

  t.textContent = msg; t.className = `toast ${type} show`;
